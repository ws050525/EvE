# EVE 配置
# 模型是一等公民：[models.*] 声明有什么，[modes.*] 只声明用哪个。
# 换本地模型 / 换云端厂商 = 改这里的几行，不动代码。

[app]
default_mode = "chat"
log_dir = "logs"
data_dir = ".data"           # API Key 加密存放处
model_dirs = ["models"]      # /scan 会扫描这些目录下的 *.gguf

# ---------- 上下文预算 ----------
# 本地 8192 窗口，长任务几轮就撞墙。每步请求前估算一次，超了就先摘要、再截断。
context_tokens = 0           # prompt 预算；0 = 按模型窗口自动（留出输出空间，上限 24k）
keep_recent_turns = 4        # 压缩时至少保留最近几轮原文
tool_output_chars = 6000     # 单个工具结果最多入库多少字符
max_steps = 12               # 全局兜底；各档位可以在 [modes.*] 里单独定 max_steps
auto_confirm = false         # 最高权限：所有工具（含写文件、跑命令）都不再询问。
                             # 界面上切换会存到 .data/prefs.json，这里只是默认值

# ---------- work 档的边界 ----------
work_root = "."              # 文件工具和 shell_exec 的根目录，越界一律拒绝

# ---------- 视觉（本地 Qwen3-VL 当"眼睛"）----------
# 云端模型不收图，桌面操作又需要看。留空 = 自动挑第一个带 mmproj 的模型。
[vision]
model = ""                   # 例如 "qwen3vl-4b"

# ---------- 浏览器真交互 ----------
# 用本机已装的 Edge（走 CDP），不下载任何浏览器。
# 需要人工登录 / 过验证码时，把 headless 改成 false，或者让 agent 调 browser_open(show=true)。
[browser]
headless = true
port = 9333                  # 调试端口，被占用就换一个
binary = ""                  # 留空自动找 Edge / Chrome；也可以写全路径
profile = ""                 # 留空用 .tmp/browser-profile（登录状态会留在这里）

# ---------- 语音 ----------
# 模型放在 models/voice/ 下（不进版本库）。识别用 sherpa-onnx，只依赖 onnxruntime。
[voice]
# 识别用 SenseVoice（2024-07 版）：中文准确率比 paraformer-small 高，还自带标点。
# 下载：& 'D:\python\python.exe' tools\fetch_voice_models.py
# 没下载也没关系，下面 asr_fallbacks 里第一个存在的会顶上。
asr_model = "models/voice/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17"
asr_fallbacks = ["models/voice/sherpa-onnx-paraformer-zh-small-2024-03-09"]
kws_model = "models/voice/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01"
wake_word = "伊芙"
kws_enabled = true           # 常听唤醒：说「伊芙」就直接进录音，不用按键
silence_ms = 1000            # 说完后静音多久算一句结束（900 有点急，长句子会被切开）
max_seconds = 20             # 单次录音上限

# 唤醒与断句的阈值——叫不醒 / 叫太多次才醒，先调这几个
kws_threshold = 0.22         # 唤醒灵敏度：调低更容易叫醒（0.10 很敏感），调高更难
vad_energy_floor = 0.010     # 低于这个音量不算说话；环境吵就调高（0.02 以上）
vad_noise_gain = 2.5         # 开口门限 = max(energy_floor, 环境噪音 × 这个倍数)
vad_hold_ratio = 0.7         # 说话中门限降到高门限的多少：调低更不容易被换气声切断
vad_min_speech_ms = 240      # 连续说多久才算真的在说话，挡掉咳嗽 / 敲键盘

# 断句引擎：energy（默认，纯能量）/ silero（模型判定，嘈杂环境明显更稳）
# 用 silero 需要先下载 silero_vad.onnx（同一个抓取脚本会下）
vad_engine = "energy"
silero_vad_model = "models/voice/silero_vad.onnx"

# 播报：离线 VITS 中文女声。界面上「点模型名 → 选择音色」可以换，换完会记到 .data/voice.json。
# melo 是最自然的一个（44.1kHz 播报女声）；备选 theresa / eula / keqing。
tts_model = "models/voice/vits-melo-tts-zh_en"
tts_enabled = true
tts_speed = 1.05             # 0.5–2.0；1.0 是模型原始语速。太快会显得急、发硬
tts_volume = 1.0             # 0–1.5
tts_speaker = 0              # 单人模型只有一个音色
tts_noise_scale = 0.667      # 语气起伏：调大更有感情，超过 0.9 容易沙哑
tts_noise_scale_w = 0.8      # 停顿随机性：调大更自然，太大节奏会乱

# 「AI 音色」后处理。上一版是"清楚优先"，提亮 0.30 + 压缩 0.60，听感发燥发硬；
# 现在是"柔和优先"：4.5kHz 以上压一点（deharsh），压缩放轻，起伏留着才自然。
tts_fx = true
tts_fx_warmth = 0.16         # 低频厚度 0–0.3，大一点更暖
tts_fx_clarity = 0.06        # 中高频存在感 0–0.6，大了发燥
tts_fx_deharsh = 0.22        # 齿音柔化 0–0.6，大了发闷
tts_fx_space = 0.06          # 空间感 0–0.3，大了发空
tts_fx_compression = 0.30    # 压缩 0–1，大了压扁、发硬

# ---------- 推理引擎（本地模型的运行容器）----------

[engines.llamacpp]
# 从 Aico 项目复制一份到本项目 tools/ 之后，把这里改成 "tools/llama.cpp/llama-server.exe"
bin = "D:/1/Aico AI - 1.1/llama.cpp/llama-server.exe"
threads = 8
extra_args = []

# ---------- 本地模型 ----------

[models.qwen3vl-4b]
label = "Qwen3-VL 4B Q4_K_M"
kind = "local_gguf"
engine = "llamacpp"
path = "models/Qwen3-VL-4B-Instruct-GGUF/Qwen/Qwen3-VL-4B-Instruct-GGUF/Qwen3VL-4B-Instruct-Q4_K_M.gguf"
mmproj = "models/Qwen3-VL-4B-Instruct-GGUF/Qwen/Qwen3-VL-4B-Instruct-GGUF/mmproj-Qwen3VL-4B-Instruct-F16.gguf"
ctx = 8192
ngl = 99

# 同一份权重、更小的上下文：用于验证热切换，也适合显存紧张时
[models.qwen3vl-4b-small]
label = "Qwen3-VL 4B（4k 上下文）"
kind = "local_gguf"
engine = "llamacpp"
path = "models/Qwen3-VL-4B-Instruct-GGUF/Qwen/Qwen3-VL-4B-Instruct-GGUF/Qwen3VL-4B-Instruct-Q4_K_M.gguf"
mmproj = "models/Qwen3-VL-4B-Instruct-GGUF/Qwen/Qwen3-VL-4B-Instruct-GGUF/mmproj-Qwen3VL-4B-Instruct-F16.gguf"
ctx = 4096
ngl = 99

# ---------- 云端模型 ----------
# 密钥统一存在 KeyStore 的 deepseek 名下（/key deepseek），两个模型共用
#
# 单价单位：元 / 百万 tokens。这里填的是**高峰档上限**，宁可高估也不低估；
# 命中缓存的输入按 10% 计。要改价只改这几行，代码不动。

[models.deepseek-flash]
label = "DeepSeek V4.1 Flash"
kind = "cloud_api"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-flash"
api_key_ref = "deepseek"
ctx = 131072                 # 云端窗口给足，实际预算由 context_tokens 卡
price_in = 2.0               # 输入（未命中缓存）
price_out = 8.0              # 输出
price_cached_in = 0.2        # 输入（命中缓存）

[models.deepseek-pro]
label = "DeepSeek V4 Pro"
kind = "cloud_api"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-pro"
api_key_ref = "deepseek"
ctx = 131072
price_in = 9.0
price_out = 27.0
price_cached_in = 0.9

# ---------- 档位：prompt + 工具集 + 默认用哪个模型 ----------

[modes.chat]
label = "聊天"
model = "qwen3vl-4b"
system_prompt = "prompts/chat.md"
tools = []
require_confirm = false
max_tokens = 512
temperature = 0.7

[modes.desktop]
label = "桌面"
model = "deepseek-flash"     # 工具调用本地 4B 太不稳（参数经常错），桌面档也走云端
system_prompt = "prompts/desktop.md"
tools = ["todo_write", "share_write", "share_read", "screen_read", "screen_locate", "image_read", "app_launch", "app_list", "window_list", "window_focus", "window_close", "key_type", "key_hotkey", "mouse_click", "screen_capture", "web_search", "http_get"]
require_confirm = true
max_tokens = 4096            # 写到编辑器里的内容可能很长；512 会把工具参数截断
max_steps = 20
temperature = 0.2

[modes.work]
label = "工作"
model = "deepseek-flash"     # 默认 flash：够用且便宜；要更强就在模型菜单里临时换 pro
system_prompt = "prompts/work.md"
tools = ["todo_write", "project_init", "project_status", "share_write", "share_read", "screen_read", "screen_locate", "image_read", "web_search", "http_get", "browser_open", "browser_read", "browser_click", "browser_type", "browser_wait", "browser_screenshot", "browser_back", "browser_close", "fs_read", "fs_write", "fs_list", "office_write", "shell_exec", "app_launch", "app_list", "window_list", "window_focus", "key_type", "screen_capture"]
require_confirm = true
max_tokens = 8192            # 写文章/长文档时一次几千字，2048 会被砍成半句
max_steps = 32               # 查资料 → 写正文 → 做 PPT → 自检，十几步不够用
temperature = 0.3
context_tokens = 24000       # 云端按 token 计费，给足但别放飞（24k 约 ¥0.05 / 轮）
