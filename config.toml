# EVE 配置
# 模型是一等公民：[models.*] 声明有什么，[modes.*] 只声明用哪个。
# 换本地模型 / 换云端厂商 = 改这里的几行，不动代码。

[app]
default_mode = "chat"
log_dir = "logs"
data_dir = ".data"           # API Key 加密存放处
model_dirs = ["models"]      # /scan 会扫描这些目录下的 *.gguf

# ---------- 推理引擎（本地模型的运行容器）----------

[engines.llamacpp]
# 从 Aico 项目复制一份到本项目 tools/ 之后，把这里改成 "tools/llama.cpp/llama-server.exe"
bin = "D:/1/Aico AI - 1.1/llama.cpp/llama-server.exe"
threads = 8
extra_args = []

# ---------- 本地模型 ----------

[models.qwen3vl-4b]
label = "Qwen3-VL 4B Q4_K_M"
kind = "local_gguf"
engine = "llamacpp"
path = "models/Qwen3-VL-4B-Instruct-GGUF/Qwen/Qwen3-VL-4B-Instruct-GGUF/Qwen3VL-4B-Instruct-Q4_K_M.gguf"
mmproj = "models/Qwen3-VL-4B-Instruct-GGUF/Qwen/Qwen3-VL-4B-Instruct-GGUF/mmproj-Qwen3VL-4B-Instruct-F16.gguf"
ctx = 8192
ngl = 99

# 同一份权重、更小的上下文：用于验证热切换，也适合显存紧张时
[models.qwen3vl-4b-small]
label = "Qwen3-VL 4B（4k 上下文）"
kind = "local_gguf"
engine = "llamacpp"
path = "models/Qwen3-VL-4B-Instruct-GGUF/Qwen/Qwen3-VL-4B-Instruct-GGUF/Qwen3VL-4B-Instruct-Q4_K_M.gguf"
mmproj = "models/Qwen3-VL-4B-Instruct-GGUF/Qwen/Qwen3-VL-4B-Instruct-GGUF/mmproj-Qwen3VL-4B-Instruct-F16.gguf"
ctx = 4096
ngl = 99

# ---------- 云端模型（填 key 即可用，先留空）----------

[models.deepseek]
label = "DeepSeek Chat"
kind = "cloud_api"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "EVE_CLOUD_API_KEY"

# ---------- 档位：prompt + 工具集 + 默认用哪个模型 ----------

[modes.chat]
model = "qwen3vl-4b"
system_prompt = "prompts/chat.md"
tools = []
require_confirm = false
max_tokens = 512
temperature = 0.7

[modes.desktop]
model = "qwen3vl-4b"
system_prompt = "prompts/desktop.md"
tools = ["app_launch", "window_list", "window_focus", "window_close", "key_type", "key_hotkey", "mouse_click", "screen_capture"]
require_confirm = true
max_tokens = 512
temperature = 0.2

[modes.work]
model = "deepseek"
system_prompt = "prompts/work.md"
tools = ["fs_read", "fs_write", "shell_exec"]
require_confirm = true
max_tokens = 2048
temperature = 0.3
